<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071018" />
    <title>GameForTg — игры в Telegram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      ;(function () {
        var wa = window.Telegram && window.Telegram.WebApp
        if (!wa) return
        try {
          wa.ready()
          wa.expand()
          wa.setHeaderColor('#071018')
          wa.setBackgroundColor('#071018')
          if (wa.setBottomBarColor) wa.setBottomBarColor('#071018')
          if (wa.disableVerticalSwipes) wa.disableVerticalSwipes()
          if (wa.requestFullscreen && (!wa.isVersionAtLeast || wa.isVersionAtLeast('8.0'))) {
            wa.requestFullscreen()
            setTimeout(function () {
              try {
                if (!wa.isFullscreen) wa.requestFullscreen()
              } catch (e) {}
            }, 250)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
