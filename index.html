<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071018" />
    <meta name="build-id" content="__BUILD_ID__" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Playfort — games in Telegram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        background: #071018;
      }
      /* Keep the shell blank until this HTML is confirmed current — prevents a
         stale GameForTg bundle from painting before location.replace. */
      #root {
        opacity: 0;
        pointer-events: none;
      }
      #root.gft-ready {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      ;(function () {
        function reveal() {
          var root = document.getElementById('root')
          if (root) root.classList.add('gft-ready')
        }
        try {
          var base = '/gamefortg/'
          if (location.pathname.indexOf('/gamefortg') !== 0) base = '/'
          var KEY = 'gft-build-id'
          var url = base + 'version.json?t=' + Date.now()
          var settled = false
          // Only used if the network hangs — never reveal a known-stale shell.
          var failSafe = setTimeout(function () {
            if (!settled) reveal()
          }, 2500)
          fetch(url, { cache: 'no-store' })
            .then(function (r) {
              return r.json()
            })
            .then(function (v) {
              if (!v || !v.id) {
                settled = true
                clearTimeout(failSafe)
                reveal()
                return
              }
              var meta = document.querySelector('meta[name="build-id"]')
              var embedded = meta && meta.getAttribute('content')
              var stored = null
              try {
                stored = localStorage.getItem(KEY)
              } catch (e) {}
              var next = new URL(location.href)
              var already = next.searchParams.get('v') === v.id
              var stale =
                (embedded && embedded !== '__BUILD_ID__' && embedded !== v.id && !already) ||
                (stored && embedded && stored !== embedded && stored === v.id && !already)
              if (stale) {
                next.searchParams.set('v', v.id)
                next.searchParams.set('_', String(Date.now()))
                try {
                  localStorage.setItem(KEY, v.id)
                } catch (e) {}
                // Do not reveal — jump straight to the fresh shell.
                location.replace(next.toString())
                return
              }
              if (embedded && embedded === v.id) {
                try {
                  localStorage.setItem(KEY, v.id)
                } catch (e) {}
              }
              settled = true
              clearTimeout(failSafe)
              reveal()
            })
            .catch(function () {
              settled = true
              clearTimeout(failSafe)
              reveal()
            })
        } catch (e) {
          reveal()
        }
      })()
    </script>
    <script>
      ;(function () {
        var wa = window.Telegram && window.Telegram.WebApp
        if (!wa) return
        try {
          wa.ready()
          wa.expand()
          wa.setHeaderColor('#071018')
          wa.setBackgroundColor('#071018')
          if (wa.setBottomBarColor) wa.setBottomBarColor('#071018')
          if (wa.disableVerticalSwipes) wa.disableVerticalSwipes()
          // Single fullscreen request only — retries live in applyTelegramChrome.
          if (wa.requestFullscreen && (!wa.isVersionAtLeast || wa.isVersionAtLeast('8.0'))) {
            if (!wa.isFullscreen) wa.requestFullscreen()
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
