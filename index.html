<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071018" />
    <meta name="build-id" content="__BUILD_ID__" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>GameForTg — игры в Telegram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      ;(function () {
        // Bust Telegram WebView HTML/JS cache when a newer deploy exists.
        try {
          var base = '/gamefortg/'
          if (location.pathname.indexOf('/gamefortg') !== 0) base = '/'
          var KEY = 'gft-build-id'
          var url = base + 'version.json?t=' + Date.now()
          fetch(url, { cache: 'no-store' })
            .then(function (r) {
              return r.json()
            })
            .then(function (v) {
              if (!v || !v.id) return
              var meta = document.querySelector('meta[name="build-id"]')
              var embedded = meta && meta.getAttribute('content')
              var stored = null
              try {
                stored = localStorage.getItem(KEY)
              } catch (e) {}
              var next = new URL(location.href)
              var already = next.searchParams.get('v') === v.id
              // Stale HTML shell vs current Pages deploy.
              if (embedded && embedded !== '__BUILD_ID__' && embedded !== v.id && !already) {
                next.searchParams.set('v', v.id)
                next.searchParams.set('_', String(Date.now()))
                try {
                  localStorage.setItem(KEY, v.id)
                } catch (e) {}
                location.replace(next.toString())
                return
              }
              // Remember the newest id we have successfully loaded.
              if (embedded && embedded === v.id) {
                try {
                  localStorage.setItem(KEY, v.id)
                } catch (e) {}
                return
              }
              // If we previously loaded a newer build than this HTML, force again.
              if (stored && embedded && stored !== embedded && stored === v.id && !already) {
                next.searchParams.set('v', v.id)
                next.searchParams.set('_', String(Date.now()))
                location.replace(next.toString())
              }
            })
            .catch(function () {})
        } catch (e) {}
      })()
    </script>
    <script>
      ;(function () {
        var wa = window.Telegram && window.Telegram.WebApp
        if (!wa) return
        try {
          wa.ready()
          wa.expand()
          wa.setHeaderColor('#071018')
          wa.setBackgroundColor('#071018')
          if (wa.setBottomBarColor) wa.setBottomBarColor('#071018')
          if (wa.disableVerticalSwipes) wa.disableVerticalSwipes()
          if (wa.requestFullscreen && (!wa.isVersionAtLeast || wa.isVersionAtLeast('8.0'))) {
            wa.requestFullscreen()
            setTimeout(function () {
              try {
                if (!wa.isFullscreen) wa.requestFullscreen()
              } catch (e) {}
            }, 250)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
